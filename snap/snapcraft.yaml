name: word-hunter
base: core24
version: '1.1.2'
summary: Local-first reader and vocabulary trainer
description: |
  Read real texts, save vocabulary with its original context, and review it
  with spaced repetition. Word Hunter keeps learning data local and supports
  text to speech, offline translation models, imported books, PDFs, EPUB
  files, subtitles, OCR, and manual transfer packages between devices.

grade: stable
confinement: strict
license: AGPL-3.0-or-later
icon: src/assets/icon-256.png

platforms:
  amd64:
    build-on:
      - amd64
    build-for:
      - amd64

slots:
  single-instance:
    interface: dbus
    bus: session
    name: com.wordhunter.app.SingleInstance

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: com.wordhunter.app.SingleInstance

apps:
  word-hunter:
    command: usr/bin/word-hunter-rustified
    desktop: usr/share/applications/word-hunter.desktop
    common-id: com.wordhunter.app
    extensions: [gnome]
    environment:
      XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
      XDG_DATA_HOME: $SNAP_USER_DATA/.local/share
    plugs:
      # The GNOME extension supplies the standard desktop, graphics, settings,
      # and Wayland/X11 interfaces.
      - browser-support
      - network
      - network-bind
      - audio-playback
      - home
      - removable-media
      - single-instance-plug
    slots:
      - single-instance

parts:
  word-hunter:
    plugin: dump
    source: https://github.com/Ironship/WordHunter/releases/download/WordHunter1.1.2/word-hunter_1.1.2_amd64.deb
    source-type: deb
    source-checksum: sha256/a5115cc6aaff0406323bb336900c68a5d554c21b7d3c525e2f7cccee630a4c0a
    stage-packages:
      - dbus-daemon
      - dbus-session-bus-common
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - poppler-utils
      - calibre
      # Runs the pinned yt-dlp of the part below.
      - python3
      - libxdo3
    override-build: |
      craftctl default

      desktop="$CRAFT_PART_INSTALL/usr/share/applications/Word Hunter.desktop"
      canonical_desktop="$CRAFT_PART_INSTALL/usr/share/applications/word-hunter.desktop"
      appstream="$CRAFT_PART_INSTALL/usr/share/metainfo/com.wordhunter.app.metainfo.xml"
      test -f "$desktop"
      test -f "$appstream"
      mv "$desktop" "$canonical_desktop"
      sed -i \
        -e 's|^Exec=.*$|Exec=word-hunter|' \
        -e 's|^Icon=.*$|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/com.wordhunter.app.png|' \
        "$canonical_desktop"
      sed -i \
        -e 's|<launchable type="desktop-id">[^<]*</launchable>|<launchable type="desktop-id">word-hunter.desktop</launchable>|' \
        "$appstream"

  yt-dlp:
    # The upstream release from PyPI, pinned. Noble's yt-dlp package is too
    # old for YouTube, and its script's /usr/bin/python3 shebang resolves to
    # the base's interpreter, which does not see the snap's packages. Word
    # Hunter finds usr/bin/yt-dlp next to its own executable.
    plugin: dump
    source: https://files.pythonhosted.org/packages/69/b2/8cd1613f56eed7ceb64fbd4df3f1c01246bfb098e6f398228bafda22b80b/yt_dlp-2026.8.19-py3-none-any.whl
    source-type: zip
    source-checksum: sha256/1d57897e94c6665a0a6f9bc54b34e584284e32c034ffab3a7df25d8f7b24eedf
    organize:
      yt_dlp: usr/lib/word-hunter/yt-dlp/yt_dlp
      yt_dlp-2026.8.19.dist-info: usr/lib/word-hunter/yt-dlp/yt_dlp-2026.8.19.dist-info
    override-build: |
      craftctl default
      install -d "$CRAFT_PART_INSTALL/usr/bin"
      cat >"$CRAFT_PART_INSTALL/usr/bin/yt-dlp" <<'WRAPPER'
      #!/bin/sh
      # yt-dlp from the snap's own python and packages.
      python="$SNAP/usr/bin/python3"
      [ -x "$python" ] || python=python3
      PYTHONPATH="$SNAP/usr/lib/word-hunter/yt-dlp${PYTHONPATH:+:$PYTHONPATH}" exec "$python" -m yt_dlp "$@"
      WRAPPER
      chmod 755 "$CRAFT_PART_INSTALL/usr/bin/yt-dlp"
