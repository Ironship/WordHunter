name: word-hunter
base: core24
version: '1.1.0'
summary: Local-first reader and vocabulary trainer
description: |
  Read real texts, save vocabulary with its original context, and review it
  with spaced repetition. Word Hunter keeps learning data local and supports
  text to speech, offline translation models, imported books, PDFs, EPUB
  files, subtitles, OCR, and manual transfer packages between devices.

grade: stable
confinement: strict
license: AGPL-3.0-or-later
icon: src/assets/icon-256.png

platforms:
  amd64:
    build-on:
      - amd64
    build-for:
      - amd64

slots:
  single-instance:
    interface: dbus
    bus: session
    name: com.wordhunter.app.SingleInstance

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: com.wordhunter.app.SingleInstance

apps:
  word-hunter:
    command: usr/bin/word-hunter-rustified
    desktop: usr/share/applications/word-hunter.desktop
    common-id: com.wordhunter.app
    extensions: [gnome]
    environment:
      XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
      XDG_DATA_HOME: $SNAP_USER_DATA/.local/share
    plugs:
      # The GNOME extension supplies the standard desktop, graphics, settings,
      # and Wayland/X11 interfaces.
      - browser-support
      - network
      - network-bind
      - audio-playback
      - home
      - removable-media
      - single-instance-plug
    slots:
      - single-instance

parts:
  word-hunter:
    plugin: dump
    source: https://github.com/Ironship/WordHunter/releases/download/WordHunter1.1.0/word-hunter_1.1.0_amd64.deb
    source-type: deb
    source-checksum: sha256/d95617843fb96fd9e645e55b822cc222227a6746491adb1bf906c1c74d00a421
    stage-packages:
      - dbus-daemon
      - dbus-session-bus-common
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - poppler-utils
      - calibre
      # yt-dlp is in the Ubuntu noble universe archive (yt-dlp_*.deb) and
      # stages a /usr/bin/yt-dlp python script; python3 (already in the
      # core24 base, listed explicitly for snapcraft's dependency solver)
      # runs it from the snap's own /usr/lib/python3/dist-packages.
      - yt-dlp
      - python3
      - libxdo3
    override-build: |
      craftctl default

      desktop="$CRAFT_PART_INSTALL/usr/share/applications/Word Hunter.desktop"
      canonical_desktop="$CRAFT_PART_INSTALL/usr/share/applications/word-hunter.desktop"
      appstream="$CRAFT_PART_INSTALL/usr/share/metainfo/com.wordhunter.app.metainfo.xml"
      test -f "$desktop"
      test -f "$appstream"
      mv "$desktop" "$canonical_desktop"
      sed -i \
        -e 's|^Exec=.*$|Exec=word-hunter|' \
        -e 's|^Icon=.*$|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/com.wordhunter.app.png|' \
        "$canonical_desktop"
      sed -i \
        -e 's|<launchable type="desktop-id">[^<]*</launchable>|<launchable type="desktop-id">word-hunter.desktop</launchable>|' \
        "$appstream"
