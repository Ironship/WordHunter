AutoName: Word Hunter Pocket
Summary: Read texts, save vocabulary, and review words with spaced repetition
Description: |
  Word Hunter Pocket is a reader and vocabulary-learning workspace.
  It imports text, EPUB files, subtitles, and PDFs with a text layer.
  Selected words can be saved with translations and source context, then
  reviewed with flashcards and spaced repetition.

  Books, vocabulary, settings, and progress are stored locally. Data can be
  moved between devices with explicit ZIP transfer packages.

  No account is required. Public-domain book discovery, online dictionaries,
  translation providers, Wikipedia image search, YouTube subtitles, and
  YouGlish examples are optional network features.

  The Android project is generated by Tauri 2 and built from the tagged
  source with Rust and the Android NDK.

RepoType: git
Repo: https://github.com/Ironship/WordHunter.git

Builds:
  - versionName: 1.0.9
    versionCode: 100000909
    commit: WordHunter1.0.9
    # Proposed recipe for the F-Droid build server. It mirrors the release
    # recipe in scripts/build.bat: pin the frontend, generate the Tauri
    # Android project, build libword_hunter.so with the NDK, then assemble
    # the release APK through Gradle. The build server must have the Rust
    # toolchain (rustup/cargo) and NDK r27 available.
    init:
      - npm ci --ignore-scripts --no-audit --no-fund
      - npm run build:frontend
      - cargo tauri android init --ci --skip-targets-install
      - rustup target add aarch64-linux-android
    prebuild:
      - export ANDROID_HOME=$$SDK$$
      - export NDK_HOME=$$SDK$$/ndk/27.0.12077973
      - export PATH=$$NDK_HOME$$/toolchains/llvm/prebuilt/linux-x86_64/bin:$$PATH$$
      - export CC_aarch64_linux_android=$$NDK_HOME$$/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
      - export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$$CC_aarch64_linux_android$$
      - cargo build --release --target aarch64-linux-android --manifest-path src-tauri/Cargo.toml
      - mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
      - cp src-tauri/target/aarch64-linux-android/release/libword_hunter.so src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/
    build: gradle
    gradle: src-tauri/gen/android
    output: build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    ndk_version: r27
